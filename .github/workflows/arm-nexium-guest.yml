name: ARM experimental NeXium guest proof

on:
  push:
    branches:
      - 'stage-390-*'
      - 'stage-396-*'
      - 'stage-398-*'
      - 'stage-399-*'
      - 'stage-400-*'
      - 'stage-399-*'
      - 'stage-400-*'
  pull_request:
    paths:
      - '.github/workflows/arm-nexium-guest.yml'
      - 'tools/audit_nexium_arm_guest.py'
      - 'tools/test_audit_nexium_arm_guest.py'
      - 'tools/audit_nexium_arm_cold_boot.py'
      - 'tools/test_audit_nexium_arm_cold_boot.py'
      - 'tools/audit_nexium_arm_controls.py'
      - 'tools/test_audit_nexium_arm_controls.py'
      - 'tools/audit_nexium_arm_burst.py'
      - 'tools/test_audit_nexium_arm_burst.py'
      - 'tools/audit_nexium_arm_readiness.py'
      - 'tools/test_audit_nexium_arm_readiness.py'
      - 'switch/source/main.cpp'
      - 'switch/Makefile'
      - 'include/field_battle_arm*.hpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-nro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build explicitly opted-in native ARM training NRO
        run: |
          make -C switch -j2 WA_ARM_EXPERIMENTAL=1
          python3 tools/audit_switch_nro.py switch/wild_arms_field.nro --json switch/wild_arms_field.nro.audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage390-arm-explicit-nro
          path: |
            switch/wild_arms_field.nro
            switch/wild_arms_field.nro.audit.json
          if-no-files-found: error

  ne-xium-guest:
    needs: arm-nro
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    container:
      image: fedora:44
    env:
      # Pin same official NeXium nightly proven in parent Stage371 run.
      NEXIUM_URL: https://github.com/nexium-emu/nexium-nightly/releases/download/nightly/nexium-linux-x86_64.tar.gz
      NEXIUM_ARCHIVE_SHA256: c933fbbcf8d1b011de8d4a79c9d8eb55c0678a305947af9388ddb40ce5960a66
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage390-arm-explicit-nro
          path: native-arm
      - name: Install Xvfb, Mesa Vulkan, PIL and NeXium libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            mesa-vulkan-drivers vulkan-tools xorg-x11-server-Xvfb \
            xdotool ImageMagick python3-pillow gtk3 alsa-lib systemd-libs \
            libxkbcommon libxkbcommon-x11 vulkan-loader \
            file curl tar gzip coreutils procps-ng
          ldd --version | head -n 1
      - name: Prove strict auditor rejects synthetic bad pixels and WABJ
        run: |
          /usr/bin/python3 -m py_compile tools/audit_nexium_arm_guest.py
          /usr/bin/python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_guest.py' -v
          /usr/bin/python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_cold_boot.py' -v
          /usr/bin/python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_controls.py' -v
          /usr/bin/python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_burst.py' -v
          /usr/bin/python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_readiness.py' -v
      - name: Fetch exact SHA-256 verified official NeXium Linux binary
        run: |
          set -euo pipefail
          mkdir -p nexium-dist arm-guest/screenshots arm-guest/coldboot arm-guest/burst
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 \
            "$NEXIUM_URL" -o nexium-dist/nexium.tar.gz
          echo "$NEXIUM_ARCHIVE_SHA256  nexium-dist/nexium.tar.gz" | sha256sum -c -
          tar -xzf nexium-dist/nexium.tar.gz -C nexium-dist/
          test -x nexium-dist/NeXium/nexium
      - name: Prepare previously validated NeXium loader-compatible NRO wrapper
        run: |
          python3 tools/prepare_nexium_nro_probe.py \
            native-arm/wild_arms_field.nro \
            arm-guest/arm_loader_probe_only.nro \
            --report arm-guest/loader-probe-manifest.json
      - name: Capture actual distinct ordinary-R and experimental-ZL+R guest sessions
        timeout-minutes: 7
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp > arm-guest/xvfb.log 2>&1 &
          sleep 4
          export DISPLAY=:99
          export NEXIUM_VIDEO_FFMPEG=0
          export SDL_AUDIODRIVER=dummy
          export WGPU_BACKEND=vulkan
          export LIBGL_ALWAYS_SOFTWARE=1
          export RUST_BACKTRACE=1
          if test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          capture() {
            import -display :99 -window root "arm-guest/screenshots/$1.png"
          }
          press() {
            xdotool keydown --clearmodifiers "$1"
            sleep 0.23
            xdotool keyup "$1"
            sleep 0.43
          }
          launch() {
            label="$1"
            root_key="${2:-$label}"
            export NEXIUM_DATA_ROOT="$RUNNER_TEMP/wa-arm-$root_key"
            # Prepare only the otherwise absent empty game directory.
            # A mounted/empty ARM directory is a required guest-audit
            # invariant, not an accidental false-negative on first boot.
            mkdir -p "$NEXIUM_DATA_ROOT/sdmc/switch/wild_arms_field"
            test -z "$(find "$NEXIUM_DATA_ROOT/sdmc/switch/wild_arms_field" -mindepth 1 -print -quit)"
            # Direct PID: no timeout wrapper may masquerade as a guest.
            # GitHub's timeout-minutes bounds this entire capture step.
            ./nexium-dist/NeXium/nexium \
              "$PWD/arm-guest/arm_loader_probe_only.nro" \
              > "arm-guest/$label-process.log" 2>&1 &
            guest_pid=$!
            eval "${label}_pid=$guest_pid"
            sleep 15
            kill -0 "$guest_pid"
            executable=$(readlink "/proc/$guest_pid/exe")
            case "$executable" in
              */NeXium/nexium) ;;
              *) echo "Not a live NeXium PID: $guest_pid ($executable)" >&2; return 1 ;;
            esac
            wid=$(xdotool search --onlyvisible --class nexium 2>/dev/null | tail -n 1) || true
            test -n "$wid"
            xdotool windowfocus "$wid"
            # Host X => Switch B, disables old 23-step autoplay.
            press x
            sleep 0.75
          }
          stop_guest() {
            # An actual NeXium first guest on #39519963779 rendered
            # three valid images, but the CI script hung at bare wait(2)
            # after TERM for seven minutes. Do not wait on a live emulator.
            echo "stopping $label pid=$guest_pid at $(date -u +%FT%TZ)" \
              >> arm-guest/termination-events.log
            kill -TERM "$guest_pid" 2>/dev/null || true
            stopped=false
            forced=false
            for attempt in $(seq 1 40); do
              status=$(ps -o stat= -p "$guest_pid" 2>/dev/null | tr -d ' ') || true
              if test -z "$status" || [[ "$status" == Z* ]]; then
                stopped=true
                break
              fi
              sleep 0.25
            done
            if test "$stopped" != true; then
              # SIGKILL is a bounded fallback on the same verified PID,
              # NEVER a fabricated "normal" NeXium exit.
              forced=true
              echo "SIGTERM ignored by $label; issuing monitored SIGKILL" \
                >> arm-guest/termination-events.log
              kill -KILL "$guest_pid" 2>/dev/null || true
              for attempt in $(seq 1 30); do
                status=$(ps -o stat= -p "$guest_pid" 2>/dev/null | tr -d ' ') || true
                if test -z "$status" || [[ "$status" == Z* ]]; then
                  stopped=true
                  break
                fi
                sleep 0.2
              done
            fi
            if test "$stopped" != true; then
              echo "Guest $label could not be stopped after bounded TERM/KILL" >&2
              return 1
            fi
            # The OS now reports the child stopped/zombie, so wait is safe.
            set +e
            wait "$guest_pid"
            exit_code=$?
            set -e
            if test "$forced" = true; then
              test "$exit_code" -eq 137 || {
                echo "Forced $label exit !=137: $exit_code" >&2; return 1;
              }
            else
              case "$exit_code" in
                0|143) ;;
                *) echo "Unexpected $label exit: $exit_code" >&2; return 1 ;;
              esac
            fi
            echo "stopped $label pid=$guest_pid exit=$exit_code forced=$forced" \
              >> arm-guest/termination-events.log
            printf -v "${label}_wait_status" '%s' "$exit_code"
            printf -v "${label}_force_killed" '%s' "$forced"
            sleep 1
          }
          # First independent guest: ordinary R is unchanged. B-close
          # writes baseline's own WABJ, providing a positive disk control.
          launch baseline
          capture 00_baseline_field
          press e  # Switch R
          capture 01_baseline_r_battle
          press x  # Switch B exits
          capture 02_baseline_return
          stop_guest

          # Separate guest + fresh SD root. ZL=host R key, Switch R=host E.
          launch arm
          xdotool keydown --clearmodifiers r
          sleep 0.16
          press e
          xdotool keyup r
          sleep 0.38
          capture 03_arm_full

          # X => Switch X => ARM Fire. Keep held for second frame; no repeat.
          xdotool keydown --clearmodifiers v
          sleep 0.34
          capture 04_arm_fired
          sleep 0.36
          capture 05_arm_fire_held
          xdotool keyup v
          sleep 0.25

          # Switch Y=host Z. Two other heroes Guard, concluding round one.
          press z
          press z
          press n  # Switch Minus => ARM Reload on renewed actor 0.
          capture 06_arm_reloaded
          # Stage396: a fresh 3/3 after cold restart proves nothing unless
          # the PREVIOUS guest actually EXITED with spent ammunition.
          # Reload consumed hero 0 turn; let heroes 1/2 Guard, then take a
          # second genuine ARM shot in round 3 before closing to SDMC.
          press z
          press z
          press v  # 3/3 -> 2/3; foe 1 now down with a real shot.
          import -display :99 -window root \
            arm-guest/coldboot/08_arm_spent_before_exit.png
          press x  # B exits ARM with 2/3 still volatile; NO WABJ.
          capture 07_arm_return
          stop_guest

          BASELINE_PID="$baseline_pid" ARM_PID="$arm_pid" \
          BASELINE_WAIT_STATUS="$baseline_wait_status" \
          ARM_WAIT_STATUS="$arm_wait_status" \
          BASELINE_FORCE_KILLED="$baseline_force_killed" \
          ARM_FORCE_KILLED="$arm_force_killed" python3 -c '
          import json,os
          from pathlib import Path
          Path("arm-guest/processes.json").write_text(
              json.dumps({"baseline_pid":int(os.environ["BASELINE_PID"]),
                          "arm_pid":int(os.environ["ARM_PID"]),
                          "baseline_wait_completed":True,
                          "arm_wait_completed":True,
                          "baseline_wait_status":int(os.environ["BASELINE_WAIT_STATUS"]),
                          "arm_wait_status":int(os.environ["ARM_WAIT_STATUS"]),
                          "baseline_force_killed":os.environ["BASELINE_FORCE_KILLED"]=="true",
                          "arm_force_killed":os.environ["ARM_FORCE_KILLED"]=="true"},
                         sort_keys=True)+"\n")
          '
          # THIRD genuinely new NeXium guest process, but the exact same
          # ARM SDMC root used by the second guest. Transient ammo must
          # begin from 3/3 again with zero persisted game files.
          launch armrestart arm
          import -display :99 -window root \
            arm-guest/coldboot/09_arm_restart_field.png
          xdotool keydown --clearmodifiers r
          sleep 0.16
          press e
          xdotool keyup r
          sleep 0.38
          import -display :99 -window root \
            arm-guest/coldboot/10_arm_restart_full.png
          # Stage399: Switch ZR maps to host T in the pinned NeXium.
          # Burst is one tactical turn: 3/3 => 1/3 and first foe down.
          # Hold without release for a second screenshot to forbid refire.
          xdotool keydown --clearmodifiers t
          sleep 0.35
          import -display :99 -window root \
            arm-guest/burst/12_arm_burst_fired.png
          sleep 0.35
          import -display :99 -window root \
            arm-guest/burst/13_arm_burst_held.png
          xdotool keyup t
          sleep 0.2
          press x
          import -display :99 -window root \
            arm-guest/coldboot/11_arm_restart_return.png
          stop_guest

          ARMRESTART_PID="$armrestart_pid" \
          ARMRESTART_WAIT_STATUS="$armrestart_wait_status" \
          ARMRESTART_FORCE_KILLED="$armrestart_force_killed" python3 -c '
          import json,os
          from pathlib import Path
          Path("arm-guest/coldboot-process.json").write_text(
              json.dumps({"armrestart_pid":int(os.environ["ARMRESTART_PID"]),
                          "armrestart_wait_status":int(os.environ["ARMRESTART_WAIT_STATUS"]),
                          "armrestart_force_killed":os.environ["ARMRESTART_FORCE_KILLED"]=="true",
                          "armrestart_wait_completed":True},
                         sort_keys=True)+"\n")
          '
      - name: Strict pixel, guest process and isolated save-file audit
        run: |
          /usr/bin/python3 tools/audit_nexium_arm_guest.py \
            --screenshots arm-guest/screenshots \
            --baseline-root "$RUNNER_TEMP/wa-arm-baseline" \
            --arm-root "$RUNNER_TEMP/wa-arm-arm" \
            --processes arm-guest/processes.json \
            --report arm-guest/arm-audit.json
      - name: Audit genuine third guest cold boot with the same ARM SDMC
        run: |
          /usr/bin/python3 tools/audit_nexium_arm_cold_boot.py \
            --original-shots arm-guest/screenshots \
            --cold-shots arm-guest/coldboot \
            --processes arm-guest/processes.json \
            --cold-process arm-guest/coldboot-process.json \
            --arm-root "$RUNNER_TEMP/wa-arm-arm" \
            --report arm-guest/coldboot-audit.json
      - name: Verify ARM controls hints on real NeXium battle frames
        run: |
          /usr/bin/python3 tools/audit_nexium_arm_controls.py \
            --main-shots arm-guest/screenshots \
            --reboot-shots arm-guest/coldboot \
            --report arm-guest/arm-controls-audit.json
      - name: Audit real ZR Burst ammo, downed foe and held-key guest frames
        run: |
          /usr/bin/python3 tools/audit_nexium_arm_burst.py \
            --main-shots arm-guest/screenshots \
            --cold-shots arm-guest/coldboot \
            --burst-shots arm-guest/burst \
            --report arm-guest/arm-burst-audit.json
      - name: Audit real dynamic Burst readiness on ordinary and 3 guest ARM frames
        run: |
          /usr/bin/python3 tools/audit_nexium_arm_readiness.py \
            --original-shots arm-guest/screenshots \
            --cold-shots arm-guest/coldboot \
            --burst-shots arm-guest/burst \
            --report arm-guest/arm-readiness-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage390-arm-real-ne-xium-evidence
          path: |
            arm-guest/
          if-no-files-found: warn
