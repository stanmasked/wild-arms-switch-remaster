name: Host core tests

concurrency:
  # Preserve one pending/running execution per workflow + event + PR/branch.
  # Do not let historical field-prototype commits consume the queue.
  # Reset the legacy concurrency key after runs remained in progress after their jobs terminated.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-queue-v2
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'switch/**'
      - 'tests/*.c'
      - 'tests/*.cc'
      - 'tests/*.cpp'
      - 'tests/*.h'
      - 'tests/*.hpp'
      - 'tests/**/*.c'
      - 'tests/**/*.cc'
      - 'tests/**/*.cpp'
      - 'tests/**/*.h'
      - 'tests/**/*.hpp'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'switch/**'
      - 'tests/*.c'
      - 'tests/*.cc'
      - 'tests/*.cpp'
      - 'tests/*.h'
      - 'tests/*.hpp'
      - 'tests/**/*.c'
      - 'tests/**/*.cc'
      - 'tests/**/*.cpp'
      - 'tests/**/*.h'
      - 'tests/**/*.hpp'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
