name: ARM guest auditor contract (Intel Mac)

on:
  push:
    branches:
      - 'stage-390-*'
      - 'stage-392-*'
      - 'stage-396-*'
      - 'stage-398-*'
      - 'stage-399-*'
      - 'stage-400-*'
      - 'stage-401-*'
  pull_request:
    paths:
      - '.github/workflows/arm-guest-audit-intel.yml'
      - 'tools/audit_nexium_arm_guest.py'
      - 'tools/test_audit_nexium_arm_guest.py'
      - 'tools/audit_nexium_arm_cold_boot.py'
      - 'tools/test_audit_nexium_arm_cold_boot.py'
      - 'tools/audit_nexium_arm_controls.py'
      - 'tools/test_audit_nexium_arm_controls.py'
      - 'tools/audit_nexium_arm_burst.py'
      - 'tools/test_audit_nexium_arm_burst.py'
      - 'tools/audit_nexium_arm_readiness.py'
      - 'tools/test_audit_nexium_arm_readiness.py'
      - 'tools/audit_nexium_arm_victory.py'
      - 'tools/test_audit_nexium_arm_victory.py'
      - 'tools/test_audit_nexium_battle_two_victories.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-synthetic-contract:
    name: ARM guest auditor contract (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python/CPU provenance
        run: |
          uname -m
          python3 --version
      - name: Install image fixture dependency
        run: python3 -m pip install 'Pillow>=10,<13'
      - name: Check strict ARM auditor syntax
        run: |
          python3 -m py_compile tools/audit_nexium_arm_guest.py
          python3 -m py_compile tools/test_audit_nexium_arm_guest.py
          python3 -m py_compile tools/audit_nexium_arm_cold_boot.py
          python3 -m py_compile tools/test_audit_nexium_arm_cold_boot.py
          python3 -m py_compile tools/audit_nexium_arm_controls.py
          python3 -m py_compile tools/test_audit_nexium_arm_controls.py
          python3 -m py_compile tools/audit_nexium_arm_burst.py
          python3 -m py_compile tools/test_audit_nexium_arm_burst.py
          python3 -m py_compile tools/audit_nexium_arm_readiness.py
          python3 -m py_compile tools/test_audit_nexium_arm_readiness.py
          python3 -m py_compile tools/audit_nexium_arm_victory.py
          python3 -m py_compile tools/test_audit_nexium_arm_victory.py
      - name: Run fifty synthetic auditor contract scenarios
        run: |
          python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_guest.py' -v
          python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_cold_boot.py' -v
          python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_controls.py' -v
          python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_burst.py' -v
          python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_readiness.py' -v
          python3 -m unittest discover -s tools -p 'test_audit_nexium_arm_victory.py' -v
      - name: Record explicitly synthetic boundary
        run: |
          echo 'These synthetic tests validate the AUDITOR only, not an actual NeXium guest.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real Xvfb guest evidence remains gated on the separate ARM NeXium workflow.' >> "$GITHUB_STEP_SUMMARY"
