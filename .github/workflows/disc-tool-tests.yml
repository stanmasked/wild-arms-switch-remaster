name: Disc analysis unit tests

concurrency:
  # Preserve one pending/running execution per workflow + event + PR/branch.
  # Do not let historical field-prototype commits consume the queue.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic overlay tests (no game image required)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
