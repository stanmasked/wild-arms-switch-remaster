            "third_pid":int(os.environ["THIRD_PID"]),
            "fourth_pid":int(os.environ["FOURTH_PID"]),
            "fifth_pid":int(os.environ["FIFTH_PID"]),
            "fourth_wait_completed":True,
            "fifth_wait_completed":True,
            "same_emulator_data_root":True},sort_keys=True))' \
            > nexium-probe/repaired-restart/processes.json

      - name: Extract guest SAVE phase diagnostics for the fourth process
        if: always()
        run: |
          set +e
          printf 'Fourth guest trace from host log:\n'
          grep 'WA_SAVE_TRACE' nexium-probe/repaired-sd/fourth-process.log | tail -n 12 || true
          printf 'Fourth guest trace from internal NeXium logs:\n'
          grep -h 'WA_SAVE_TRACE' nexium-probe/repaired-sd/fourth-internal.log             | tail -n 12 || true
          printf 'Fourth guest trace from isolated SDMC:\n'
