            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          timeout --signal=TERM --kill-after=8 75s \
            ./nexium-dist/NeXium/nexium \
            "$PWD/nexium-probe/ne_loader_probe_only.nro" \
            > nexium-probe/battle-scene/sixth-process.log 2>&1 &
          sixth_pid=$!
          echo "$sixth_pid" > nexium-probe/battle-scene/sixth-process.pid
          sleep 15
          window_id=$(xdotool search --onlyvisible --class 'nexium' 2>/dev/null |
            tail -n 1) || true
          test -n "$window_id"
          xdotool windowfocus "$window_id"
          battle_key() {
            printf '%s %s\n' "$(date -u +%FT%TZ)" "$1" >> nexium-probe/battle-scene/keys.log
            xdotool keydown --clearmodifiers "$1"
            sleep 0.22
            xdotool keyup "$1"
            sleep 0.30
          }
          # Switch B => host X: cancel untouched autoplay and enter manual.
          battle_key x
          import -display :99 -window root \
            nexium-probe/battle-scene/00_field_before.png
          # Verified NeXium default keyboard binding: Switch R => host E.
          battle_key e
          import -display :99 -window root \
            nexium-probe/battle-scene/01_battle_open.png
          # Switch A => C: keep SAME key held across both screenshots.
          # A separate press would correctly attack again, so not allowed.
          xdotool keydown --clearmodifiers c
          sleep 0.32
          import -display :99 -window root \
            nexium-probe/battle-scene/02_after_strike.png
          sleep 0.35
          import -display :99 -window root \
            nexium-probe/battle-scene/03_strike_held.png
          xdotool keyup c
          sleep 0.20
          # Switch Y => Z: guard second hero; cursor selects third.
          battle_key z
          import -display :99 -window root \
            nexium-probe/battle-scene/04_after_guard.png
          # Switch B => X: exit combat. No input reaches field gameplay.
          battle_key x
          import -display :99 -window root \
            nexium-probe/battle-scene/05_field_return.png
          kill -TERM "$sixth_pid" 2>/dev/null || true
