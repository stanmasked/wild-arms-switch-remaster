            --reference same-commit-host-references \
            --screenshots nexium-probe/independent-restart \
            --first-notice-json nexium-probe/storage-feedback-audit.json \
            --first-saved nexium-probe/manual-snapshot/05_event_saved.png \
            --processes nexium-probe/independent-restart/processes.json \
            --output nexium-probe/independent-restart-audit.json
      - name: Verify isolated NeXium SDMC journal then corrupt newest generation
        run: |
