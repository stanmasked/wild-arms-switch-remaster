          /usr/bin/python3 tools/audit_nexium_write_trace.py             --output nexium-probe/repaired-sd/write-trace.json             nexium-probe/repaired-sd/fourth-save-phase.txt             nexium-probe/repaired-sd/fourth-process.log             nexium-probe/repaired-sd/fourth-internal.log || true
      - name: Audit actual fourth guest SD repair and fifth guest clean SD load
        run: |
