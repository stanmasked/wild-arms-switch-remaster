          seventh_pid=$!
          echo "$seventh_pid" > nexium-probe/encounter-scene/seventh-process.pid
          sleep 15
          window_id=$(xdotool search --onlyvisible --class 'nexium' 2>/dev/null |
            tail -n 1) || true
          test -n "$window_id"
          xdotool windowfocus "$window_id"
          encounter_key() {
            printf '%s %s\n' "$(date -u +%FT%TZ)" "$1" >> nexium-probe/encounter-scene/keys.log
            xdotool keydown --clearmodifiers "$1"
            sleep 0.22
            xdotool keyup "$1"
            sleep 0.45
          }
          # Enter manual exploration. Keyboard mapping from NeXium source:
          # Switch B=X, ZR=T, D-pad=arrow keys, A=C.
          encounter_key x
          import -display :99 -window root \
            nexium-probe/encounter-scene/00_field_start.png
          encounter_key t
          import -display :99 -window root \
            nexium-probe/encounter-scene/01_zr_enabled.png
          # Move three accepted tiles to the area-0 event marker.
          # The paused event must prevent a premature step encounter.
          xdotool keydown --clearmodifiers Right
          sleep 1.3
          xdotool keyup Right
          sleep 0.50
          import -display :99 -window root \
            nexium-probe/encounter-scene/02_event_pending.png
          # A acknowledges the marker, but cannot itself count as a step.
          encounter_key c
          import -display :99 -window root \
            nexium-probe/encounter-scene/03_event_acknowledged.png
          # The fourth successful move is left out of the marker.
          xdotool keydown --clearmodifiers Left
          sleep 0.36
          xdotool keyup Left
          sleep 0.85
          import -display :99 -window root \
            nexium-probe/encounter-scene/04_encounter_open.png
          encounter_key c
          import -display :99 -window root \
            nexium-probe/encounter-scene/05_encounter_strike.png
          encounter_key x
          import -display :99 -window root \
            nexium-probe/encounter-scene/06_field_return.png
