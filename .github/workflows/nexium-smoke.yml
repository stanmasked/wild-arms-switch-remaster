      - name: Launch FOURTH independent guest to repair damaged SD journal
        timeout-minutes: 3
        run: |
          set -eu
          mkdir -p nexium-probe/repaired-sd
          export DISPLAY=:99
          export NEXIUM_DATA_ROOT="$RUNNER_TEMP/nexium-wild-arms-data"
          export NEXIUM_VIDEO_FFMPEG=0
          export SDL_AUDIODRIVER=dummy
          export WGPU_BACKEND=vulkan
          export LIBGL_ALWAYS_SOFTWARE=1
          export RUST_BACKTRACE=1
          export RUST_LOG=info,nexium_kernel::kernel::svc=debug
          export NEXIUM_DIAG=1
          if test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          timeout --signal=TERM --kill-after=8 70s \
            ./nexium-dist/NeXium/nexium \
            "$PWD/nexium-probe/ne_loader_probe_only.nro" \
            > nexium-probe/repaired-sd/fourth-process.log 2>&1 &
          fourth_pid=$!
          echo "$fourth_pid" > nexium-probe/repaired-sd/fourth.pid
          sleep 15
          wid=$(xdotool search --onlyvisible --class 'nexium' 2>/dev/null | tail -n 1) || true
          test -n "$wid"
          xdotool windowfocus "$wid"
          # Fresh RAM is empty; damaged newest B triggers fallback A + SD WARN.
          xdotool keydown --clearmodifiers n
          sleep 0.23
          xdotool keyup n
          sleep 0.19
          import -display :99 -window root \
            nexium-probe/repaired-sd/01_sd_warn_before_repair.png
          sleep 1.3
          # Save the recovered state back to disk. The repaired generation B
          # replaces the CRC-invalid slot; A is never unlinked or rewritten.
          xdotool keydown --clearmodifiers z
          sleep 0.23
          xdotool keyup z
          sleep 0.19
          import -display :99 -window root \
            nexium-probe/repaired-sd/02_sd_saved_after_repair.png
          sleep 1.3
          import -display :99 -window root \
            nexium-probe/repaired-sd/03_repaired_start_scene.png
          xdotool keydown --clearmodifiers m || true
          sleep 0.22
          xdotool keyup m || true
          sleep 2
          kill -TERM "$fourth_pid" 2>/dev/null || true
          set +e
          wait "$fourth_pid"
          result=$?
          set -e
          echo "$result" > nexium-probe/repaired-sd/fourth-exit-code.txt
          # Experimental NRO writes one non-sensitive phase line to SDMC.
          # Copy it BEFORE guest 5 can replace this evidence.
          guest_trace="$NEXIUM_DATA_ROOT/sdmc/switch/wild_arms_field/save-phase.txt"
          if test -s "$guest_trace"; then
            cp "$guest_trace" nexium-probe/repaired-sd/fourth-save-phase.txt
          fi
          # Preserve fourth-process internal debug logs BEFORE fifth starts.
          logfile=$(find "$NEXIUM_DATA_ROOT/logs" -maxdepth 1 -type f             -name '*.log' -printf '%T@ %p\n' 2>/dev/null             | sort -nr | head -n 1 | cut -d' ' -f2-) || true
          if test -n "$logfile" && test -f "$logfile"; then
            cp "$logfile" nexium-probe/repaired-sd/fourth-internal.log
          fi

      - name: Launch FIFTH guest from repaired SD with no in-memory checkpoint
        timeout-minutes: 3
        run: |
          set -eu
