      - name: Audit SEVENTEENTH real guest older-B fallback and no-loss two-victory CRC repair
        run: |
          /usr/bin/python3 tools/audit_nexium_battle_latest_crc_fallback.py \
            --frames nexium-probe/battle-latest-recovery-screens \
            --original-field nexium-probe/battle-double-victory-screens/00_first_manual.png \
            --known-second-win-panel nexium-probe/battle-double-victory-screens/06_third_reload.png \
            --valid-latest-a nexium-probe/battle-latest-recovery/pristine-gen3.a \
            --valid-fallback-b nexium-probe/battle-latest-recovery/pristine-gen2.b \
            --corrupt-latest-a nexium-probe/battle-latest-recovery/damaged-newest-gen3.a \
            --repaired-a nexium-probe/battle-latest-recovery/repaired-gen3.a \
            --unchanged-b nexium-probe/battle-latest-recovery/unchanged-gen2.b \
            --previous-pids nexium-probe/battle-double-victory/guest-pids.txt \
            --seventeenth-pid nexium-probe/battle-latest-recovery/seventeenth-pid.txt \
            --report nexium-probe/battle-latest-recovery-audit.json

      - name: EIGHTEENTH guest wins after CRC repair then NINETEENTH restarts and retreats
        timeout-minutes: 4
        run: |
          set -eu
          mkdir -p nexium-probe/battle-post-repair \
            nexium-probe/battle-post-repair-screens
          export DISPLAY=:99
          # Same proven SDMC namespace as guests 14-17; never reset between.
          export NEXIUM_DATA_ROOT="$RUNNER_TEMP/nexium-stage365-double-victory"
          export NEXIUM_VIDEO_FFMPEG=0
          export SDL_AUDIODRIVER=dummy
          export WGPU_BACKEND=vulkan
          export LIBGL_ALWAYS_SOFTWARE=1
          export RUST_BACKTRACE=1
          if test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          dir=nexium-probe/battle-post-repair
          shots=nexium-probe/battle-post-repair-screens
          base="$NEXIUM_DATA_ROOT/sdmc/switch/wild_arms_field/battle-progress"
          test -f "$base.a" && test -f "$base.b"
          # Ensure stage366 actually repaired latest A, rather than
          # silently constructing a new synthetic guest journal here.
          /usr/bin/python3 - "$base.a" "$base.b" \
            nexium-probe/battle-latest-recovery/repaired-gen3.a \
            nexium-probe/battle-latest-recovery/unchanged-gen2.b <<'PY'
          from pathlib import Path
          import sys
          a, b, expected_a, expected_b = (Path(p) for p in sys.argv[1:])
          assert a.read_bytes() == expected_a.read_bytes()
          assert b.read_bytes() == expected_b.read_bytes()
          PY
          cp "$base.a" "$dir/pre-third-win-gen3.a"
          cp "$base.b" "$dir/pre-third-win-gen2.b"
          : > "$dir/guest-pids.txt"
          : > "$dir/key-edges.log"

          boot() {
            label="$1"
            timeout --signal=TERM --kill-after=8 80s \
              ./nexium-dist/NeXium/nexium \
              "$PWD/nexium-probe/ne_loader_probe_only.nro" \
              > "$dir/$label-process.log" 2>&1 &
            guest_pid=$!
            printf '%s %s\n' "$label" "$guest_pid" >> "$dir/guest-pids.txt"
            sleep 15
            window_id=$(xdotool search --onlyvisible --class 'nexium' 2>/dev/null |
              tail -n 1) || true
            test -n "$window_id"
            xdotool windowfocus "$window_id"
          }
          press() {
            printf '%s %s\n' "$(date -u +%FT%TZ)" "$1" >> "$dir/key-edges.log"
            xdotool keydown --clearmodifiers "$1"
            sleep 0.23
            xdotool keyup "$1"
            sleep 0.47
          }
          panel() {
            xdotool keydown --clearmodifiers r
            sleep 0.45
            import -display :99 -window root "$shots/$1.png"
            xdotool keyup r
            sleep 0.35
          }
          stop_guest() {
            kill -TERM "$guest_pid" 2>/dev/null || true
            set +e
            wait "$guest_pid"
            result=$?
            set -e
            echo "$result" >> "$dir/exit-codes.txt"
            sleep 0.4
          }
          boot eighteenth
          first_pid="$guest_pid"
          press x
          panel 00_eighteenth_restored_gen3
          press e
          for attack in 1 2 3 4 5 6 7; do
            press c
          done
          import -display :99 -window root \
            "$shots/01_eighteenth_third_victory.png"
          /usr/bin/python3 - "$shots/01_eighteenth_third_victory.png" <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from audit_nexium_field_journal import read_rgb
          from audit_nexium_battle_two_victories import victory
          assert victory(read_rgb(sys.argv[1])), "third full-HP fight never reached VICTORY"
          PY
          press x
          panel 02_eighteenth_three_win_rewards
          stop_guest
          test -f "$base.a" && test -f "$base.b"
          cp "$base.a" "$dir/after-third-win-gen3.a"
          cp "$base.b" "$dir/after-third-win-gen4.b"
          # Game must have recorded third win + 8 EXP/12 G in B.
          /usr/bin/python3 - "$base.b" <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from audit_nexium_battle_persistence import read_journal
          b = read_journal(sys.argv[1])
          assert (b["generation"], b["wins"], b["retreats"],
                  b["experience"], b["gella"], b["outcome"]) == (4, 3, 1, 24, 36, 1)
          PY

          # Distinct process must restore third earned victory BEFORE
          # any combat and must not award XP/Gella for following retreat.
          boot nineteenth
          test "$guest_pid" != "$first_pid"
          press x
          panel 03_nineteenth_reload_three_wins
          press e
          press x
          import -display :99 -window root \
            "$shots/04_nineteenth_after_retreat.png"
          stop_guest
          test -f "$base.a" && test -f "$base.b"
          cp "$base.a" "$dir/final-gen5.a"
          cp "$base.b" "$dir/final-gen4.b"
          test ! -e "$NEXIUM_DATA_ROOT/sdmc/switch/wild_arms_field/field-save.a"
          test ! -e "$NEXIUM_DATA_ROOT/sdmc/switch/wild_arms_field/field-save.b"

      - name: Audit EIGHTEENTH/NINETEENTH genuine third victory and 24EXP/36Gella restart
        run: |
          /usr/bin/python3 tools/audit_nexium_battle_post_crc_victory.py \
            --screens nexium-probe/battle-post-repair-screens \
            --original-field nexium-probe/battle-double-victory-screens/00_first_manual.png \
            --recovered-two-win-panel nexium-probe/battle-latest-recovery-screens/00_crc_fallback_rewards.png \
            --repaired-gen3-a nexium-probe/battle-post-repair/pre-third-win-gen3.a \
            --retained-gen2-b nexium-probe/battle-post-repair/pre-third-win-gen2.b \
            --third-win-a nexium-probe/battle-post-repair/after-third-win-gen3.a \
            --third-win-b nexium-probe/battle-post-repair/after-third-win-gen4.b \
            --final-a nexium-probe/battle-post-repair/final-gen5.a \
            --final-b nexium-probe/battle-post-repair/final-gen4.b \
            --prior-three-pids nexium-probe/battle-double-victory/guest-pids.txt \
            --prior-seventeenth-pid nexium-probe/battle-latest-recovery/seventeenth-pid.txt \
            --new-pids nexium-probe/battle-post-repair/guest-pids.txt \
            --key-log nexium-probe/battle-post-repair/key-edges.log \
            --output nexium-probe/battle-post-repair-audit.json

      - name: Retain NeXium internal host logs from both runs
        if: always()
        run: |
          set -eu
          mkdir -p nexium-probe
          for label in guest control; do
            if test "$label" = guest; then
              root="$RUNNER_TEMP/nexium-wild-arms-data/logs"
            else
              root="$RUNNER_TEMP/nexium-empty-control/logs"
            fi
            dest="nexium-probe/$label-internal.log"
            if test -d "$root"; then
              latest=$(find "$root" -maxdepth 1 -name 'nexium-*.log' -type f -printf '%T@ %p\n' |
                sort -nr | head -n 1 | cut -d' ' -f2-) || true
              if test -n "$latest" && test -f "$latest"; then
                head -c 2000000 "$latest" > "$dest"
              fi
            fi
            if ! test -f "$dest"; then
              echo "Internal log not found: $root" > "nexium-probe/$label-internal-missing.txt"
            fi
          done
          /usr/bin/python3 tools/audit_nexium_session.py \
            --guest nexium-probe/guest-internal.log \
            --control nexium-probe/control-internal.log \
            --report nexium-probe/session-audit.json
      - name: Select five real ordered checkpoints against same-commit host PNGs
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_checkpoints.py \
            --reference same-commit-host-references \
            --initial nexium-probe/screen-initial.png \
            --timeline nexium-probe/timeline \
            --selected nexium-probe/verified-checkpoints \
            --report nexium-probe/five-checkpoints.json
          cp nexium-probe/verified-checkpoints/01_area0_event.png nexium-probe/screen-after-x.png
          cp nexium-probe/verified-checkpoints/02_area0_exit.png nexium-probe/screen-middle.png
          cp nexium-probe/verified-checkpoints/03_area1_start.png nexium-probe/screen-later.png
          cp nexium-probe/verified-checkpoints/04_area0_return.png nexium-probe/screen-final.png
      - name: Compare all five scaled game images pixel-by-pixel excluding the NeXium HUD
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_pixel_parity.py \
            --reference same-commit-host-references \
            --observed nexium-probe/verified-checkpoints \
            --report nexium-probe/pixel-parity.json
      - name: Audit actual guest SD/RAM notice colors and text
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_storage_feedback.py \
            --screenshots nexium-probe/status-feedback \
            --report nexium-probe/storage-feedback-audit.json
      - name: Audit real Switch Y/Minus and pending event restore screenshots
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_manual_snapshot.py \
            --reference same-commit-host-references \
            --screenshots nexium-probe/manual-snapshot \
            --report nexium-probe/manual-snapshot-audit.json
      - name: Audit real guest L-held exploration journal screenshots
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_field_journal.py \
            --screenshots nexium-probe/field-journal \
            --report nexium-probe/field-journal-audit.json
      - name: Audit real two-area completion screens
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_field_completion.py \
            --screenshots nexium-probe/field-completion \
            --report nexium-probe/field-completion-audit.json
      - name: Verify intended Switch X triggers visible world changes
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_autoplay.py \
            --initial nexium-probe/screen-initial.png \
            --intermediate nexium-probe/screen-after-x.png \
              nexium-probe/screen-middle.png \
              nexium-probe/screen-later.png \
              nexium-probe/screen-final.png \
            --require-event-roundtrip \
            --report nexium-probe/autoplay-evidence.json
      - name: Classify pixel evidence; require guest pixels for success
        id: evidence
        if: always()
        run: |
          /usr/bin/python3 tools/audit_nexium_probe.py \
            nexium-probe/screen-initial.png \
            nexium-probe/screen-after-x.png \
            nexium-probe/screen-middle.png \
            nexium-probe/screen-later.png \
            nexium-probe/screen-final.png \
            --commit "$GITHUB_SHA" \
            --nexium-archive-sha256 "$NEXIUM_ARCHIVE_SHA256" \
            --report nexium-probe/evidence.json
      - name: Record explicit verification status in workflow summary
        if: always()
        run: |
          echo "## NeXium smoke / experimental" >> "$GITHUB_STEP_SUMMARY"
          echo "Native build succeeded; NeXium guest execution is **not assumed**." >> "$GITHUB_STEP_SUMMARY"
          if test -f nexium-probe/evidence.json; then
            cat nexium-probe/evidence.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No classifiable emulator frame evidence was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/process-exit-code.txt; then
            echo "NeXium process exit code: $(cat nexium-probe/process-exit-code.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/five-checkpoints.json; then
            echo "Five-scene structural evidence:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; x=json.load(open("nexium-probe/five-checkpoints.json")); print("validated scenes:",len(x["verified_scenes"]),"complete:",x["full_five_checkpoint_sequence_observed"] )' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/sd-repair-audit.json; then
            echo "Fourth/fifth guest repaired SD journal and clean reload:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/sd-repair-audit.json")); print("complete:",r["all_checks_passed"],"status pixel mismatches:",sum(r["status_plaque_mismatches"].values()))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/sd-recovery-audit.json; then
            echo "Third-process damaged-SD recovery:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/sd-recovery-audit.json")); print("recovered:",r["all_checks_passed"],"notice mismatches:",r["sd_warn_mismatched_pixels"])' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/independent-restart-audit.json; then
            echo "Independent process SD reload:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/independent-restart-audit.json")); print("complete:",r["all_checks_passed"],"mismatches:",r["notice_rgb_mismatches"])' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/storage-feedback-audit.json; then
            echo "Real on-screen storage notices:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; d=json.load(open("nexium-probe/storage-feedback-audit.json")); print("all four indicators valid:",d["all_four_indicators_valid"])' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/manual-snapshot-audit.json; then
            echo "Manual Y/Minus + event restoration audit:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; d=json.load(open("nexium-probe/manual-snapshot-audit.json")); print("manual quicksave and event restore confirmed:",d["manual_quicksave_and_event_restore_confirmed"])' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/field-completion-audit.json; then
            echo "Real guest two-area 2/2 completion:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/field-completion-audit.json")); print("all checks:",r["all_checks_passed"],"count:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/field-journal-audit.json; then
            echo "Real first-guest L journal screenshot verification:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; d=json.load(open("nexium-probe/field-journal-audit.json")); print("complete:",d["open_release_collect_reopen_confirmed"],"checks:",len(d["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-audit.json; then
            echo "Sixth-process real guest battle input and pixels:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-audit.json")); print("all checks:",r["all_checks_passed"],"count:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/encounter-audit.json; then
            echo "Seventh-process opt-in ZR encounter and field return:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/encounter-audit.json")); print("all checks:",r["all_checks_passed"],"count:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-history-audit.json; then
            echo "Eighth-process ZL battle history:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-history-audit.json")); print("all checks:",r["all_checks_passed"],"count:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-persistence-audit.json; then
            echo "Ninth/tenth independent process battle SD journal reload:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-persistence-audit.json")); print("all checks:",r["all_checks_passed"],"count:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-recovery-audit.json; then
            echo "Eleventh-process recovery of older valid WABJ after CRC damage:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-recovery-audit.json")); print("all checks:",r["all_checks_passed"],"count:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-post-repair-audit.json; then
            echo "Stage367: real third victory after CRC repair, gen4 and gen5, 24 EXP/36 Gella:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-post-repair-audit.json")); print("complete:",r["all_checks_passed"],"checks:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-latest-recovery-audit.json; then
            echo "Stage366: newest corrupted gen3 A recovered older two-win gen2 B:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-latest-recovery-audit.json")); print("complete:",r["all_checks_passed"],"checks:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-double-victory-audit.json; then
            echo "Stage365: three independent NeXium guests, two cumulative wins, 16 EXP / 24 Gella:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-double-victory-audit.json")); print("complete:",r["all_checks_passed"],"checks:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f nexium-probe/battle-earned-audit.json; then
            echo "Twelfth/thirteenth guest real victory with EXP/Gella across restart:" >> "$GITHUB_STEP_SUMMARY"
            /usr/bin/python3 -c 'import json; r=json.load(open("nexium-probe/battle-earned-audit.json")); print("all checks:",r["all_checks_passed"],"count:",len(r["checks"]))' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No firmware, ROM, BIOS or commercial assets used." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexium-experimental-probe-evidence
          path: nexium-probe/
          if-no-files-found: warn
