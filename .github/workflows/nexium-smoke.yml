      - name: Require actual SD WARN and previous-generation fallback in third guest
        run: |
          /usr/bin/python3 tools/audit_nexium_sd_recovery.py verify \
            --reference same-commit-host-references \
            --screenshots nexium-probe/damaged-sd-recovery \
            --data-root "$RUNNER_TEMP/nexium-wild-arms-data" \
