name: PCSX-Redux patched build

on:
  push:
    branches: [main]
    paths:
      - tools/patch_private_pcsx_gpudump_player_step1_export.py
      - tools/patch_private_pcsx_gpudump_player_step1_dump_hash.py
      - docs/stage456-private-player-step1-native-dump-hash-binding.md
      - .github/workflows/pcsx-redux-patched-build.yml
  pull_request:
    paths:
      - tools/patch_private_pcsx_gpudump_player_step1_export.py
      - tools/patch_private_pcsx_gpudump_player_step1_dump_hash.py
      - docs/stage456-private-player-step1-native-dump-hash-binding.md
      - .github/workflows/pcsx-redux-patched-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcsx-redux-patched-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-patched-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/grumpycoders/pcsx-redux-build:noble
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined
    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Fetch exact pinned PCSX-Redux source
        env:
          UPSTREAM_SHA: de4a33e9a69abec4f567ae33567537f867dc2bba
        run: |
          git init "$RUNNER_TEMP/pcsx-redux"
          git -C "$RUNNER_TEMP/pcsx-redux" remote add origin https://github.com/grumpycoders/pcsx-redux.git
          git -C "$RUNNER_TEMP/pcsx-redux" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/pcsx-redux" checkout --detach FETCH_HEAD
          git config --global --add safe.directory "$RUNNER_TEMP/pcsx-redux"

      - name: Fetch upstream submodules
        working-directory: ${{ runner.temp }}/pcsx-redux
        run: ./.github/scripts/update-submodules.sh

      - name: Apply combined owner-local research patch
        run: |
          python3 "$GITHUB_WORKSPACE/tools/patch_private_pcsx_gpudump_player_step1_dump_hash.py" \
            "$RUNNER_TEMP/pcsx-redux" --apply
          git -C "$RUNNER_TEMP/pcsx-redux" diff --check

      - name: Build patched PCSX-Redux, host tests, and tools
        working-directory: ${{ runner.temp }}/pcsx-redux
        run: make -j 2 all pcsx-redux-tests tools LDFLAGS_Release="-static-libstdc++ -static-libgcc"

      - name: Run compiled PCSX-Redux host test suite
        working-directory: ${{ runner.temp }}/pcsx-redux
        run: xvfb-run catchsegv ./pcsx-redux-tests

      - name: Build matching pinned OpenBIOS
        working-directory: ${{ runner.temp }}/pcsx-redux
        run: make -C src/mips/openbios -j 2 all

      - name: Package patched PCSX-Redux AppImage with OpenBIOS
        working-directory: ${{ runner.temp }}/pcsx-redux
        run: |
          make install install-openbios DESTDIR=AppDir/usr
          sed -i s:/usr/bin/:: AppDir/usr/share/applications/pcsx-redux.desktop
          linuxdeploy -v3 --appdir=AppDir -e AppDir/usr/bin/pcsx-redux -d AppDir/usr/share/applications/pcsx-redux.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/pcsx-redux.png -o appimage
          mv PCSX-Redux-x86_64.AppImage PCSX-Redux-private-openbios-x86_64.AppImage

      - name: Upload patched private-runtime emulator artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pcsx-redux-patched-openbios-x86_64
          path: ${{ runner.temp }}/pcsx-redux/PCSX-Redux-private-openbios-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7