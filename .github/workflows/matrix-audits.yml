jobs:
  python-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile-check Python analyzers and tests
        run: |
          python -m compileall -q tools tests
      - name: Run matrix and trig audit unit tests (synthetic assets only)
        run: |
          python -m tools.audit_ps1_regression_gate
          python -m unittest discover -s tests -p 'test_record_base_provenance.py' -v
          python -m unittest discover -s tests -p 'test_record_address_deltas.py' -v
          python -m unittest discover -s tests -p 'test_record_executed_access_claims.py' -v
          python -m unittest discover -s tests -p 'test_record_branch_access_claims.py' -v
          python -m unittest discover -s tests -p 'test_audit_mips_load_delay_predicates.py' -v
          python -m unittest discover -s tests -p 'test_record_pipeline_coupling.py' -v
          python -m unittest discover -s tests -p 'test_record_global_slot_witness.py' -v
          python -m unittest discover -s tests -p 'test_record_temporal_slot_snapshots.py' -v
          python -m unittest discover -s tests -p 'test_record_capture_stream_binding.py' -v
          python -m unittest discover -s tests -p 'test_record_capture_provenance.py' -v
          python -m unittest discover -s tests -p 'test_record_capture_replay.py' -v
          python -m unittest discover -s tests -p 'test_record_atomic_verifier.py' -v
          python -m unittest discover -s tests -p 'test_record_verifier_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_record_guarded_admission.py' -v
          python -m unittest discover -s tests -p 'test_record_anchor_handoff.py' -v
