jobs:
  python-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile-check Python analyzers and tests
        run: |
          python -m compileall -q tools tests
      - name: Run matrix and trig audit unit tests (synthetic assets only)
        run: |
          python -m tools.audit_ps1_regression_gate
          python -m unittest discover -s tests -p 'test_record_base_provenance.py' -v
          python -m unittest discover -s tests -p 'test_record_address_deltas.py' -v
          python -m unittest discover -s tests -p 'test_record_executed_access_claims.py' -v
          python -m unittest discover -s tests -p 'test_record_branch_access_claims.py' -v
          python -m unittest discover -s tests -p 'test_record_pointer_use.py' -v
          python -m unittest discover -s tests -p 'test_gp0_matrix_*.py' -v
          python -m unittest discover -s tests -p 'test_mips_fixed32.py' -v
          python -m unittest discover -s tests -p 'test_mips_integer_step.py' -v
          python -m unittest discover -s tests -p 'test_mips_integer_sequence.py' -v
          python -m unittest discover -s tests -p 'test_mips_memory_sequence.py' -v
          python -m unittest discover -s tests -p 'test_mips_trig_memory.py' -v
          python -m unittest discover -s tests -p 'test_mips_matrix_memory.py' -v
          python -m unittest discover -s tests -p 'test_mips_control_flow.py' -v
          python -m unittest discover -s tests -p 'test_mips_load_access_profile.py' -v
          python -m unittest discover -s tests -p 'test_mips_trig_index_provenance.py' -v
          python -m unittest discover -s tests -p 'test_mips_matrix_value_lineage.py' -v
          python -m unittest discover -s tests -p 'test_mips_q12_arithmetic_reference.py' -v
          python -m unittest discover -s tests -p 'test_mips_matrix_operation_schedule.py' -v
          python -m unittest discover -s tests -p 'test_mips_builder_opcode_evidence.py' -v
          python -m unittest discover -s tests -p 'test_mips_builder_execution_evidence.py' -v
          python -m unittest discover -s tests -p 'test_mips_builder_integrity_gate.py' -v
          python -m unittest discover -s tests -p 'test_mips_ps1_matrix_reference.py' -v
          python -m unittest discover -s tests -p 'test_mips_ps1_capture_pack.py' -v
          python -m unittest discover -s tests -p 'test_mips_initial_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_mips_return_boundary.py' -v
          python -m unittest discover -s tests -p 'test_mips_final_cpu_state.py' -v
          python -m unittest discover -s tests -p 'test_mips_final_memory_state.py' -v
          python -m unittest discover -s tests -p 'test_mips_store_event_sequence.py' -v
          python -m unittest discover -s tests -p 'test_mips_store_value_sequence.py' -v
          python -m unittest discover -s tests -p 'test_mips_arithmetic_event_sequence.py' -v
          python -m unittest discover -s tests -p 'test_audit_actions_job_bootstrap.py' -v
          python -m unittest discover -s tests -p 'test_audit_ps1_regression_gate.py' -v
          python -m unittest discover -s tests -p 'test_mips_matrix_arithmetic_attribution.py' -v
          python -m unittest discover -s tests -p 'test_ps1_arithmetic_matrix_attribution.py' -v
          python -m unittest discover -s tests -p 'test_ps1_arithmetic_capture.py' -v
          python -m unittest discover -s tests -p 'test_ps1_store_value_capture.py' -v
          python -m unittest discover -s tests -p 'test_ps1_store_sequence_capture.py' -v
          python -m unittest discover -s tests -p 'test_ps1_final_memory_capture.py' -v
          python -m unittest discover -s tests -p 'test_ps1_final_cpu_capture.py' -v
          python -m unittest discover -s tests -p 'test_ps1_reference_return_boundary.py' -v
          python -m unittest discover -s tests -p 'test_ps1_pipeline_capture.py' -v
          python -m unittest discover -s tests -p 'test_mips_load_pipeline_shadow.py' -v
          python -m unittest discover -s tests -p 'test_audit_ps1_capture_pack.py' -v
          python -m unittest discover -s tests -p 'test_audit_ps1_matrix_reference.py' -v
          python -m unittest discover -s tests -p 'test_gp0_builder_integrity_gate.py' -v
          python -m unittest discover -s tests -p 'test_gp0_builder_execution_evidence.py' -v
          python -m unittest discover -s tests -p 'test_gp0_builder_opcode_evidence.py' -v
          python -m unittest discover -s tests -p 'test_gp0_matrix_operation_schedule.py' -v
          python -m unittest discover -s tests -p 'test_mips_q12_differential.py' -v
          python -m unittest discover -s tests -p 'test_audit_mips_q12_differential.py' -v
          python -m tools.audit_mips_q12_differential --cases 256 --seed 206
          python -m unittest discover -s tests -p 'test_gp0_matrix_value_lineage.py' -v
          python -m unittest discover -s tests -p 'test_gp0_trig_index_provenance.py' -v
          python -m unittest discover -s tests -p 'test_gp0_matrix_load_profile.py' -v
          python -m unittest discover -s tests -p 'test_mips_entry_dependencies.py' -v
          python -m unittest discover -s tests -p 'test_mips_input_sensitivity.py' -v
          python -m unittest discover -s tests -p 'test_mips_call_boundary.py' -v
          python -m unittest discover -s tests -p 'test_mips_caller_sources.py' -v
          python -m unittest discover -s tests -p 'test_mips_caller_cfg_sources.py' -v
          python -m unittest discover -s tests -p 'test_mips_cfg_probe_path.py' -v
          python -m unittest discover -s tests -p 'test_gp0_cfg_runtime_correlation.py' -v
          python -m unittest discover -s tests -p 'test_gp0_matrix_replay_preflight.py' -v
          python -m unittest discover -s tests -p 'test_gp0_trig_table.py' -v
          python -m unittest discover -s tests -p 'test_gp0_rotation_matrix_builder.py' -v

  host-ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build host reference tests
        run: cmake --build build --parallel 2
      - name: Run host regression suite
        run: ctest --test-dir build --output-on-failure
