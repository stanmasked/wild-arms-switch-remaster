name: ARM native host (Intel Mac)

on:
  push:
    branches:
      - 'stage-387-*'
      - 'stage-388-*'
  pull_request:
    branches:
      - 'stage-386-*'
      - 'stage-387-*'
    paths:
      - 'include/field_battle.hpp'
      - 'include/field_battle_arm.hpp'
      - 'include/field_battle_arm_controller.hpp'
      - 'include/field_battle_arm_view.hpp'
      - 'include/field_battle_arm_training.hpp'
      - 'tests/test_field_battle_arm.cpp'
      - 'tests/test_field_battle_arm_controller.cpp'
      - 'tests/test_field_battle_arm_view.cpp'
      - 'tests/test_field_battle_arm_training.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/arm-host-intel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-intel-arm-prototype:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler and architecture
        run: |
          uname -m
          clang++ --version
          cmake --version
      - name: Configure normal ARM C++ build
        run: cmake -S . -B build-arm -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Build all four independent ARM test executables
        run: |
          cmake --build build-arm --parallel 3 --target \
            wa_field_battle_arm_tests \
            wa_field_battle_arm_controller_tests \
            wa_field_battle_arm_view_tests \
            wa_field_battle_arm_training_tests
      - name: Run real native ARM combat/control/HUD CTests
        run: ctest --test-dir build-arm -R '^wa_field_battle_arm(_controller|_view|_training)?_tests$' --output-on-failure -V
      - name: Configure address and undefined-behavior instrumentation
        run: |
          cmake -S . -B build-arm-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Compile sanitizers for all four ARM test executables
        run: |
          cmake --build build-arm-sanitized --parallel 3 --target \
            wa_field_battle_arm_tests \
            wa_field_battle_arm_controller_tests \
            wa_field_battle_arm_view_tests \
            wa_field_battle_arm_training_tests
      - name: Run ARM CTests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-arm-sanitized -R '^wa_field_battle_arm(_controller|_view|_training)?_tests$' --output-on-failure -V
      - name: Report scope
        run: |
          echo 'Intel Mac: 4 native ARM CTests (normal + ASan/UBSan).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Experimental ROM-free host code only; does not exercise NeXium or Switch SDMC.' >> "$GITHUB_STEP_SUMMARY"
